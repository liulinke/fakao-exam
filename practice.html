<head>
<meta charset="UTF-8">

<meta name="description" content="支持按民法、刑法、行政法等科目及章节、难度、题型筛选刷题，可只做没做过的题，即时判分并附法条解析，帮你精准巩固薄弱知识点。">
<meta name="keywords" content="法考练习,法考刷题,法考科目练习,法考章节练习,法考题库">
<link rel="canonical" href="https://www.liulinke.com/p/fakaomoni/practice.html">
<meta property="og:type" content="website">
<meta property="og:title" content="法考科目练习 - 按科目/难度/章节刷题">
<meta property="og:description" content="支持按科目、章节、难度、题型筛选刷题，即时判分并附法条解析。">
<meta property="og:url" content="https://www.liulinke.com/p/fakaomoni/practice.html">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a5fb4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="法考模拟">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
</head>
<body>
<header class="site"><h1>⚖ 法考客观题模拟</h1><nav id="nav"></nav></header>
<div class="wrap">
  <div class="card" id="filter-card">
    <h2>科目练习</h2>
    <p>科目：<select id="f-subject"></select>
       题型：<select id="f-type"><option value="all">全部</option><option value="single">单选</option><option value="multi">多选</option><option value="indeterminate">不定项</option></select>
       难度：<select id="f-diff"><option value="all">全部</option><option value="easy">简单(★1-2)</option><option value="mid">中等(★3)</option><option value="hard">较难(★4-5)</option></select>
       顺序：<select id="f-order"><option value="random">随机</option><option value="seq">顺序</option></select>
    </p>
    <p><label class="chk"><input type="checkbox" id="f-new"> 只做没做过的题</label></p>
    <details open><summary class="muted">章节筛选</summary><div id="f-chapters" style="margin-top:8px"></div></details>
    <p style="margin-top:14px"><button class="btn" id="btn-go">开始练习</button></p>
    <p class="muted">快捷键：A–D/1–4 选择（单选点即判分），回车确认/下一题</p>
  </div>

  <div class="card" id="q-card" style="display:none">
    <div class="muted" id="p-progress"></div>
    <div id="p-box"></div>
    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn" id="btn-confirm">确认答案</button>
      <button class="btn" id="btn-next" style="display:none">下一题 →</button>
      <button class="btn ghost" id="btn-quit">结束本轮</button>
    </div>
  </div>
</div>
<footer class="site">题目为 AI 生成的原创模拟题，仅供练习，不代表真题；解析法条以现行有效版本为准。</footer>
<script src="data/config.js"></script>
<script src="js/app.js"></script>
<script src="js/bank.js"></script>
<script src="js/grader.js"></script>
<script src="js/qrender.js"></script>
<script src="data/bank/_all.js"></script>
<script>FK.renderNav("practice");</script>
<script src="js/practice.js"></script>
</body>
</html>
